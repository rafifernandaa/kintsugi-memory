name: Deploy Kintsugi Memory to Google Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: my-project-28-497709
  REGION: us-central1
  SERVICE_NAME: kintsugi-memory-service
  IMAGE_NAME: gcr.io/my-project-28-497709/kintsugi-memory-agent

jobs:
  build-and-deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Google Container Registry / Artifact Registry
        run: gcloud auth configure-docker --quiet

      - name: Build and Push Container Image
        run: |
          docker build -t ${IMAGE_NAME}:${{ github.sha }} -t ${IMAGE_NAME}:latest .
          docker push ${IMAGE_NAME}:${{ github.sha }}
          docker push ${IMAGE_NAME}:latest

      - name: Deploy to Google Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: '--allow-unauthenticated'
          env_vars: |
            GOOGLE_CLOUD_PROJECT=my-project-28-497709
            GOOGLE_CLOUD_REGION=us-central1
            GOOGLE_CLOUD_PUBSUB_TOPIC=projects/my-project-28-497709/topics/kintsugi-cliff-pings
            GEMINI_MODEL=gemini-3.7-flash
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Show Live Service URL
        run: |
          echo "✅ Deployment completed successfully!"
          gcloud run services describe ${{ env.SERVICE_NAME }} --platform managed --region ${{ env.REGION }} --format 'value(status.url)'
