steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/kintsugi-memory-agent:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/kintsugi-memory-agent:latest'
      - '.'

  # 2. Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/kintsugi-memory-agent:$BUILD_ID'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/kintsugi-memory-agent:latest'

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'kintsugi-memory-service'
      - '--image'
      - 'gcr.io/$PROJECT_ID/kintsugi-memory-agent:$BUILD_ID'
      - '--region'
      - 'us-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GEMINI_MODEL=gemini-3.5-flash,GOOGLE_CLOUD_REGION=us-west1'

images:
  - 'gcr.io/$PROJECT_ID/kintsugi-memory-agent:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/kintsugi-memory-agent:latest'

options:
  logging: CLOUD_LOGGING_ONLY
